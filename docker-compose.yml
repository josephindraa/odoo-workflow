name: odoo-workflow

services:
  app:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_APP_PORT}:8069"
    volumes:
      - ./scripts/odoo-entrypoint.sh:/usr/local/bin/odoo-entrypoint.sh:ro
      - ./config/odoo:/etc/odoo
      - ./addons:/mnt/extra-addons
      - ./vendor:/mnt/vendor-addons
      - app-data:/var/lib/odoo
    entrypoint: ["/usr/local/bin/odoo-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8069/web/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  app-data:
  db-data:
