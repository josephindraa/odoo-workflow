name: odoo-workflow

services:
  webserver:
    image: nginx:alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - NGINX_ENVSUBST_FILTER=DOMAIN_NAME
    volumes:
      - ./config/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./config/certs/prod/conf:/etc/letsencrypt:ro
      - ./config/certs/prod/www:/var/www/certbot:ro
    restart: unless-stopped

  certs:
    image: certbot/certbot:latest
    volumes:
      - ./config/certs/prod/conf:/etc/letsencrypt
      - ./config/certs/prod/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  app:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts/odoo-entrypoint.sh:/usr/local/bin/odoo-entrypoint.sh:ro
      - ./config/odoo:/etc/odoo
      - ./addons:/mnt/extra-addons
      - ./vendor:/mnt/vendor-addons
      - app-data:/var/lib/odoo
    entrypoint: ["/usr/local/bin/odoo-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8069/web/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app-data:
  db-data:
