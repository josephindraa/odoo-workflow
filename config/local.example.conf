[options]
; ==============================================================================
; REQUIRED: DATABASE & SMTP SETTINGS
; ==============================================================================
admin_passwd =
db_host = db
db_port = 5432
db_user =
db_password =

smtp_server = localhost
smtp_port = 25
smtp_user =
smtp_password =
email_from =
from_filter =

; ==============================================================================
; DATABASE ROUTING & MULTI-TENANCY
; ==============================================================================
; SECURE BY DEFAULT:
; `list_db = False` is set by default to prevent exposing the Database Manager
; (/web/database/manager) or listing databases in Production if misconfigured.
;
; FOR LOCAL DEVELOPMENT:
; Change `list_db = True` in your active `config/odoo.conf` so you can easily
; create, switch, backup, or drop databases via the Web UI.
;
; Production Guidelines:
; 1. Single Database Mode:
;    list_db = False
;    dbfilter = ^mydb$
;    db_name = mydb
; 2. Multi-Tenant Mode (Subdomain based):
;    list_db = False
;    dbfilter = ^%d$
;    db_name = False
list_db = False
dbfilter =
db_name =

; ==============================================================================
; PRODUCTION PERFORMANCE & WORKERS
; Production / High-Traffic Server Guidelines (> 20 Active Users):
; ==============================================================================
; - PROXY MODE: Set `True` when using a Reverse Proxy (Nginx) for HTTPS & WebSockets.
; - WORKERS: Formula = (CPU Cores * 2) + 1. Example: 4 Cores -> 9 Workers.
; - MAX CRON THREADS: Set to `2` so scheduled actions (cron) run on dedicated threads.
;
; Key Requirements (Workers > 0):
; 1. Server RAM: `limit_memory_soft` allocation is set to ~1.5 GB/worker.
;    Calculate total RAM = (Workers * 1.5 GB) + OS/DB allocation.
;    Example: If workers = 9, required physical server RAM is ±14–16 GB.
; 2. PostgreSQL: Increase `max_connections >= 200` in postgresql.conf.
;    This prevents "too many connections" errors when all workers are active simultaneously.
proxy_mode = True
workers = 0
max_cron_threads = 1

; ==============================================================================
; LOGGING
; ==============================================================================
; Leave empty (logfile = ) to output logs directly to stdout/console (ideal for Docker & `docker compose logs`).
; Set a physical path (e.g., /var/log/odoo/odoo.log) only for Bare-metal / non-containerized deployments.
logfile =
syslog = False
