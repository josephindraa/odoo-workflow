[options]
; ==============================================================================
; PATHS
; ==============================================================================
addons_path = /mnt/extra-addons,/mnt/vendor-addons
data_dir = /var/lib/odoo

; ==============================================================================
; DATABASE SETTINGS
; ==============================================================================
db_maxconn = 64
db_maxconn_gevent = None
db_replica_host = None
db_replica_port = None
db_sslmode = prefer

; ==============================================================================
; NETWORK, WEBSOCKET & LIMITS
; ==============================================================================
http_enable = True
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072

websocket_keep_alive_timeout = 3600
websocket_rate_limit_burst = 10
websocket_rate_limit_delay = 0.2

limit_memory_soft = 1610612736
limit_memory_hard = 2147483648
limit_time_cpu = 300
limit_time_real = 600
limit_time_real_cron = -1
limit_time_worker_cron = 0
limit_request = 8192

; ==============================================================================
; LOGGING
; ==============================================================================
log_level = info
log_handler = :INFO,werkzeug:WARNING
